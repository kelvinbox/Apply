<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f766e">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Rental application</title>
<style>
:root{
  --bg:#f4f7f7;--surface:#fff;--surface-2:#f8fafc;--text:#0f172a;--muted:#5b6472;--line:#dfe5ea;
  --brand:#0f766e;--brand-2:#0891b2;--brand-soft:#ccfbf1;--bad:#dc2626;--bad-soft:#fee2e2;--ok:#16a34a;
  --grad:linear-gradient(135deg,#0d9488 0%,#0891b2 55%,#4f46e5 100%);
  --radius:18px;--shadow:0 6px 24px -12px rgba(15,23,42,.25);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b1416;--surface:#111c1f;--surface-2:#16252a;--text:#e6f0f0;--muted:#94a3a8;--line:#22343a;--brand-soft:#123b3a;--bad-soft:#3b1515;--shadow:none}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
header{background:var(--grad);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 22px;border-radius:0 0 26px 26px}
header .k{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
header h1{margin:4px 0 2px;font-size:1.45rem;line-height:1.2}
header .sub{opacity:.92;font-size:.95rem}
.progress{height:6px;background:rgba(255,255,255,.3);border-radius:99px;margin-top:14px;overflow:hidden}
.progress i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .3s}
.steplabel{display:flex;justify-content:space-between;font-size:.8rem;margin-top:6px;opacity:.9}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
h2{font-size:1.25rem;margin:2px 0 6px}
.intro{color:var(--muted);margin:0 0 14px;line-height:1.45}
.fld{margin-bottom:18px}
.fld>label,.fld>.lbl{display:block;font-weight:650;margin-bottom:7px;line-height:1.35}
.req{color:var(--brand);margin-left:2px}
.hint{font-size:.85rem;color:var(--muted);margin-top:5px}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],textarea{
  width:100%;font:inherit;font-size:17px;color:var(--text);background:var(--surface-2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:52px;outline:0;-webkit-appearance:none;appearance:none}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus{border-color:#14b8a6;box-shadow:0 0 0 4px rgba(20,184,166,.2);background:var(--surface)}
.money{position:relative}.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
.money input{padding-left:28px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{flex:1 1 120px;min-height:52px;border:2px solid var(--line);background:var(--surface-2);color:var(--text);border-radius:14px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.opts button.on{background:var(--grad);color:#fff;border-color:transparent}
.err .opts button,.err input,.err textarea,.err .upl{border-color:var(--bad)}
.emsg{color:var(--bad);font-size:.88rem;font-weight:600;margin-top:6px}
.group{font-size:.82rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--brand);margin:6px 0 10px}
.upl{border:2px dashed #7aa9a4;border-radius:14px;padding:12px;background:var(--surface-2)}
.upl .file{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;font-size:.92rem}
.upl .file span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upl .file button{border:0;background:none;color:var(--bad);font-weight:700;font-size:.9rem;cursor:pointer;padding:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 18px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-weight:750;font-size:16px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.55}
.btn.ghost{background:var(--brand-soft);color:var(--brand);border-color:transparent}
footer{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
footer .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
footer .in .btn{flex:1}
.saved{text-align:center;font-size:.78rem;color:var(--muted);margin-top:6px;min-height:1em}
.prop{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95rem;margin:4px 0 0}
.prop dt{color:var(--muted)}.prop dd{margin:0;font-weight:700}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border:2px solid var(--line);border-radius:14px;margin-bottom:10px;cursor:pointer;background:var(--surface-2);line-height:1.4;font-size:.95rem}
.check input{width:24px;height:24px;flex:none;margin:1px 0 0;accent-color:#0d9488}
.check.on{border-color:#14b8a6;background:var(--brand-soft)}
.err.check{border-color:var(--bad)}
.notice{max-height:260px;overflow:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.9rem;line-height:1.45;margin-bottom:14px}
.notice p{margin:0 0 8px}
.sigwrap{position:relative;border:2px solid var(--line);border-radius:14px;background:#fff;touch-action:none}
.sigwrap canvas{display:block;width:100%;height:190px;border-radius:12px}
.sigwrap .ph{position:absolute;inset:0;display:grid;place-items:center;color:#94a3b8;pointer-events:none;font-size:.95rem}
.sigwrap .line{position:absolute;left:18px;right:18px;bottom:44px;border-bottom:1.5px dashed #cbd5e1;pointer-events:none}
.rev h3{display:flex;justify-content:space-between;align-items:center;font-size:1rem;margin:0 0 8px}
.rev h3 button{border:0;background:var(--brand-soft);color:var(--brand);border-radius:99px;padding:6px 14px;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
.rev dl{display:grid;grid-template-columns:minmax(0,45%) 1fr;gap:6px 12px;margin:0;font-size:.9rem}
.rev dt{color:var(--muted)}.rev dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.rev .missing{color:var(--bad);font-weight:700}
.center{text-align:center}.big{font-size:3rem;line-height:1}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:s 1s linear infinite;display:inline-block}
@keyframes s{to{transform:rotate(360deg)}}
.banner{background:var(--bad-soft);color:var(--bad);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:600}
/* ---- Field grid: short answers sit side by side on wider screens ---- */
.fields{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));column-gap:14px;align-items:end}
.fields>.group{align-self:start}
.fields>*{grid-column:1/-1}
@media (min-width:620px){ .fields>.half{grid-column:span 3} .fields>.third{grid-column:span 2} }
/* ---- Pointer and keyboard ---- */
@media (hover:hover){
  .btn:hover{filter:brightness(1.06)} .btn:not(.primary):hover{border-color:#14b8a6}
  .opts button:hover:not(.on){border-color:#14b8a6;background:var(--surface)}
  .check:hover{border-color:#14b8a6} .rev h3 button:hover{filter:brightness(.95)}
}
:focus-visible{outline:3px solid #14b8a6;outline-offset:2px}
input:focus-visible,textarea:focus-visible{outline:0}
.sigwrap canvas{cursor:crosshair}
/* ---- Step list (laptop / desktop) ---- */
aside{display:none}
aside ol{list-style:none;margin:0;padding:0}
aside li button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;font:inherit;font-size:.92rem;color:var(--muted);padding:9px 10px;border-radius:12px;cursor:default}
aside li button .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:800;background:var(--line);color:var(--muted)}
aside li.done button{color:var(--text);cursor:pointer} aside li.done button .n{background:var(--brand-soft);color:var(--brand)}
aside li.done button:hover{background:var(--surface)}
aside li.cur button{background:var(--surface);color:var(--text);font-weight:750;box-shadow:var(--shadow);border:1px solid var(--line)}
aside li.cur button .n{background:var(--grad);color:#fff}
aside .tip{font-size:.8rem;color:var(--muted);margin:14px 10px 0;line-height:1.4}
/* ---- Laptop / desktop layout ---- */
.layout{max-width:640px;margin:0 auto}
.hin{max-width:608px;margin:0 auto}
@media (min-width:960px){
  body{padding-bottom:0}
  header{padding:26px 24px 30px;border-radius:0 0 30px 30px}
  header h1{font-size:1.9rem}
  header{padding-left:0;padding-right:0}
  .hin{max-width:1040px;margin:0 auto;padding:0 24px 0 302px}
  .layout{max-width:1040px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;padding:24px 24px 48px;align-items:start}
  aside{position:sticky;top:20px;display:block}
  aside.hidden{display:none!important}
  .layout:has(aside.hidden){grid-template-columns:minmax(0,640px);justify-content:center}
  main{padding:0;max-width:none}
  .card{padding:26px 28px}
  footer{position:sticky;bottom:16px;left:auto;right:auto;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px -14px rgba(15,23,42,.35);padding:12px 16px}
  footer .in{max-width:none;justify-content:flex-end} footer .in .btn{flex:0 0 auto;min-width:150px}
  footer .saved{text-align:right}
  #hProg .steplabel{display:none}
}
@media (min-width:960px) and (max-height:700px){ aside li button{padding:6px 10px} }
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header><div class="hin">
  <div class="k">Rental application</div>
  <h1 id="hTitle">Loading…</h1>
  <div class="sub" id="hSub"></div>
  <div id="hProg" class="hidden"><div class="progress"><i id="bar" style="width:0"></i></div><div class="steplabel"><span id="stepName"></span><span id="stepNum"></span></div></div>
</div></header>
<div class="layout">
  <aside id="side" class="hidden" aria-label="Steps"></aside>
  <div class="col">
    <main id="main"><div class="card center"><span class="spin"></span></div></main>
    <footer id="foot" class="hidden"><div class="in" id="footIn"></div><div class="saved" id="saved"></div></footer>
  </div>
</div>

<script>
(function(){
'use strict';
/* ====== Settings: paste your Tenant Apply API web app URL here ====== */
var API_URL = 'https://script.google.com/macros/s/AKfycbzu3Up6HPkOgEbsmIboWfyLBwUDCwomTMO7gVC4qsjs07mI_mI8dbtv98u0XiMoLODK8w/exec';
var PAGE_VERSION = '1.1.0';

var MAX_BYTES = 8*1024*1024, MAX_EDGE = 2000;
var $ = function(s,r){ return (r||document).querySelector(s); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function money(v){ var n=Number(v); return v!==''&&v!=null&&isFinite(n)? '$'+n.toLocaleString('en-NZ',{maximumFractionDigits:2}) : String(v||''); }
function nzDate(iso){ if(!/^\d{4}-\d{2}-\d{2}/.test(iso||'')) return iso||''; var p=iso.slice(0,10).split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }

var token=(new URLSearchParams(location.search).get('t')||'').trim();
var S={ data:null, answers:{}, uploads:{}, consents:{}, step:0, steps:[], errors:{}, dirty:false, saving:false, sigDrawn:false, signedName:'' };
var LS='apply-'+token;

/* ---------- API ---------- */
function api(action,body){
  body=body||{}; body.action=action; body.token=token;
  // text/plain keeps this a "simple" request, so no CORS preflight is needed
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'})
    .then(function(r){ if(!r.ok) throw new Error('net'); return r.json(); })
    .catch(function(e){ if(e&&e.message==='net'||e instanceof TypeError) throw new Error('We couldn’t reach the server. Check your connection and try again — your answers are kept on this device.'); throw e; });
}

/* ---------- Boot ---------- */
function fatal(title,msg,icon){
  $('#side').classList.add('hidden');
  $('#hTitle').textContent=title; $('#hSub').textContent=''; $('#hProg').classList.add('hidden'); $('#foot').classList.add('hidden');
  $('#main').innerHTML='<div class="card center"><div class="big">'+(icon||'🔒')+'</div><h2 style="margin-top:10px">'+esc(title)+'</h2><p class="intro">'+esc(msg)+'</p></div>';
}
if(!token){ fatal('Link needed','Please open this page using the link in your application email.'); return; }
if(/PASTE_YOUR/.test(API_URL)){ fatal('Not set up yet','The form isn’t connected yet. Please contact us for help.','🛠'); return; }

api('load').then(function(r){
  if(!r.ok){ fatal(r.code==='expired'?'Link expired':'Link not valid', r.error||'Please contact us for a new link.'); return; }
  if(r.submitted){ done(r,true); return; }
  S.data=r; S.answers=r.answers||{}; S.uploads=r.uploads||{};
  try{ var local=JSON.parse(localStorage.getItem(LS)||'null'); if(local&&local.answers){ Object.keys(local.answers).forEach(function(k){ if(S.answers[k]===undefined||S.answers[k]==='') S.answers[k]=local.answers[k]; }); S.consents=local.consents||{}; S.signedName=local.signedName||''; } }catch(e){}
  S.steps=[{id:'welcome',title:'Welcome'}].concat(r.form).concat([{id:'sign',title:'Agree and sign'},{id:'review',title:'Check and submit'}]);
  try{ var st=+sessionStorage.getItem(LS+'-step'); if(st>0&&st<S.steps.length) S.step=st; S.maxStep=Math.min(S.steps.length-1,+localStorage.getItem(LS+'-max')||0); }catch(e){}
  render();
}).catch(function(e){ fatal('Can’t load the form', e.message, '📶'); });

/* ---------- Rules (mirrors the server) ---------- */
function visible(f){ if(!f.if) return true; var v=String(S.answers[f.if[0]]||'').trim(); return f.if[1]==='*'? !!v : v===f.if[1]; }
function check(step){
  var errs={};
  (step.fields||[]).forEach(function(f){
    if(!visible(f)) return;
    var v=f.t==='upload'? (S.uploads[f.k]||[]).length : String(S.answers[f.k]||'').trim();
    if(f.req && !v){ errs[f.k]= f.t==='upload'?'Please add a photo or file':(f.t==='yesno'||f.t==='choice')?'Please choose one':'This is required'; return; }
    if(!v||f.t==='upload') return;
    if(f.t==='email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) errs[f.k]='Check this email address';
    if(f.t==='tel' && v.replace(/\D/g,'').length<7) errs[f.k]='Check this phone number';
    if((f.t==='money'||f.t==='number') && !isFinite(Number(v.replace(/[$,\s]/g,'')))) errs[f.k]='Enter a number';
  });
  if(step.rule==='licenceOrPassport' && !String(S.answers.LicenceNumber||'').trim() && !String(S.answers.PassportNumber||'').trim()) errs.LicenceNumber='Give your driver licence number or your passport number';
  if(step.id==='sign'){
    S.data.consents.forEach(function(c){ if(S.consents[c.k]!==true) errs[c.k]='Please tick to agree'; });
    if(!S.signedName.trim()) errs.signedName='Type your full name';
    if(!S.sigDrawn) errs.signature='Please sign in the box';
  }
  return errs;
}

/* ---------- Rendering ---------- */
function setHeader(){
  var p=S.data.property, st=S.steps[S.step];
  $('#hTitle').textContent=p.address1||'Rental application';
  $('#hSub').textContent=[p.address2, p.rent!==''&&p.rent!=null? money(p.rent)+' per week':''].filter(Boolean).join(' · ');
  $('#hProg').classList.remove('hidden');
  $('#bar').style.width=Math.round(S.step/(S.steps.length-1)*100)+'%';
  $('#stepName').textContent=st.title; $('#stepNum').textContent='Step '+(S.step+1)+' of '+S.steps.length;
}
function render(){
  setHeader(); var st=S.steps[S.step], h='';
  S.maxStep=Math.max(S.maxStep||0,S.step);
  try{ sessionStorage.setItem(LS+'-step',String(S.step)); localStorage.setItem(LS+'-max',String(S.maxStep)); }catch(e){}
  var side=$('#side'); side.innerHTML=sideHtml(); side.classList.remove('hidden');
  if(st.id==='welcome') h=welcomeHtml();
  else if(st.id==='sign') h=signHtml();
  else if(st.id==='review') h=reviewHtml();
  else h=stepCard(st);
  $('#main').innerHTML=h;
  var foot='';
  if(S.step>0) foot+='<button class="btn" type="button" data-go="back">Back</button>';
  if(st.id==='review') foot+='<button class="btn primary" type="button" id="submitBtn" data-go="submit">Submit application</button>';
  else foot+='<button class="btn primary" type="button" data-go="next">'+(S.step===0?'Start':'Next')+'</button>';
  $('#footIn').innerHTML=foot; $('#foot').classList.remove('hidden');
  if(st.id==='sign') initSig();
  window.scrollTo(0,0);
}
function stepCard(st){ return '<div class="card"><h2>'+esc(st.title)+'</h2>'+(st.intro?'<p class="intro">'+esc(st.intro)+'</p>':'')+'<div class="fields">'+fieldsHtml(st.fields)+'</div></div>'; }
/* Step list beside the form on wider screens; finished steps can be revisited */
function sideHtml(){
  return '<ol>'+S.steps.map(function(st,i){ var cls=i===S.step?'cur':i<=S.maxStep?'done':'';
    return '<li class="'+cls+'"><button type="button"'+(cls==='done'?' data-edit="'+i+'"':' tabindex="-1"')+'><span class="n">'+(i<S.maxStep&&i!==S.step?'✓':(i+1))+'</span>'+esc(st.title)+'</button></li>'; }).join('')+'</ol>'+
    '<div class="tip">Your answers save as you go. You can close this page and come back to your link any time.</div>';
}
function welcomeHtml(){
  var p=S.data.property;
  return '<div class="card"><h2>Hi '+esc(String(S.answers.ApplicantName||'').split(' ')[0]||'there')+' 👋</h2>'+
    '<p class="intro">Thanks for applying. This takes about 10–15 minutes. Your answers save as you go, so you can stop and come back to this link any time.</p>'+
    '<dl class="prop"><dt>Property</dt><dd>'+esc([p.address1,p.address2].filter(Boolean).join(', '))+'</dd>'+
    (p.rent!==''&&p.rent!=null?'<dt>Rent</dt><dd>'+esc(money(p.rent))+' per week</dd>':'')+(p.tenancy?'<dt>Tenancy</dt><dd>'+esc(p.tenancy)+'</dd>':'')+
    (p.moveIn?'<dt>Available</dt><dd>'+esc(nzDate(p.moveIn))+'</dd>':'')+'</dl></div>'+
    '<div class="card"><h2 style="font-size:1.05rem">Have these ready</h2><p class="intro" style="margin:0">Your driver licence or passport (you can take a photo of it), your current and previous landlord’s contact details, and if possible your last 3 payslips or a bank statement and your tenancy agreement.</p></div>'+
    '<div class="card"><p class="intro" style="margin:0">🔒 Your information is sent securely and is only seen by the landlord. One application is needed from every adult who will be on the tenancy.</p></div>';
}
function fieldsHtml(fields){
  var h='', lastGroup='';
  fields.forEach(function(f){
    if(!visible(f)) return;
    if(f.group && f.group!==lastGroup){ h+='<div class="group">'+esc(f.group)+'</div>'; lastGroup=f.group; }
    var v=S.answers[f.k]==null?'':String(S.answers[f.k]), e=S.errors[f.k], id='f_'+f.k;
    var w=f.w||({tel:'half',email:'half',date:'half',money:'half',number:'half'}[f.t])||'';
    h+='<div class="fld'+(w?' '+w:'')+(e?' err':'')+'" data-k="'+f.k+'">';
    var lab=esc(f.l)+(f.req?'<span class="req" aria-hidden="true">*</span>':'');
    if(f.t==='yesno'||f.t==='choice'){
      var opts=f.t==='yesno'?['Yes','No']:f.o;
      h+='<div class="lbl" id="l_'+f.k+'">'+lab+'</div><div class="opts" role="radiogroup" aria-labelledby="l_'+f.k+'">'+opts.map(function(o){ return '<button type="button" role="radio" aria-checked="'+(v===o)+'" data-opt="'+esc(o)+'" data-k="'+f.k+'" class="'+(v===o?'on':'')+'">'+esc(o)+'</button>'; }).join('')+'</div>';
    } else if(f.t==='upload'){
      var list=S.uploads[f.k]||[];
      h+='<div class="lbl">'+lab+'</div><div class="upl" id="u_'+f.k+'">'+list.map(function(x){ return '<div class="file">📎 <span>'+esc(x.name)+'</span><button type="button" data-rm="'+esc(x.id)+'" data-k="'+f.k+'">Remove</button></div>'; }).join('')+
        '<label class="btn ghost block" style="cursor:pointer">📷 '+(list.length?'Add another':'Take a photo or choose a file')+'<input type="file" class="sr" data-up="'+f.k+'" accept="image/*,application/pdf" multiple></label><div class="hint" data-prog="'+f.k+'"></div></div>';
    } else if(f.t==='textarea'){
      h+='<label for="'+id+'">'+lab+'</label><textarea id="'+id+'" data-k="'+f.k+'" maxlength="2000">'+esc(v)+'</textarea>';
    } else {
      var type={email:'email',tel:'tel',date:'date'}[f.t]||'text', im={tel:'tel',money:'decimal',number:'numeric',email:'email'}[f.t]||'';
      var input='<input id="'+id+'" type="'+type+'" data-k="'+f.k+'" value="'+esc(v)+'"'+(im?' inputmode="'+im+'"':'')+(f.ac?' autocomplete="'+f.ac+'"':' autocomplete="off"')+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+(f.t==='text'?' autocapitalize="words"':'')+' maxlength="300">';
      h+='<label for="'+id+'">'+lab+'</label>'+(f.t==='money'?'<div class="money"><span>$</span>'+input+'</div>':input);
    }
    if(f.hint) h+='<div class="hint">'+esc(f.hint)+'</div>';
    if(e) h+='<div class="emsg">'+esc(e)+'</div>';
    h+='</div>';
  });
  return h;
}
function signHtml(){
  var d=S.data, e=S.errors;
  return '<div class="card"><h2>Privacy notice</h2><div class="notice">'+d.privacy.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('')+'</div>'+
    '<h2 style="font-size:1.05rem;margin-top:4px">Declarations, consents and agreements</h2><p class="intro">Tick each one to agree.</p>'+
    d.consents.map(function(c){ var on=S.consents[c.k]===true; return '<label class="check'+(on?' on':'')+(e[c.k]?' err':'')+'"><input type="checkbox" data-consent="'+c.k+'"'+(on?' checked':'')+'><span>'+esc(c.t)+'</span></label>'; }).join('')+'</div>'+
    '<div class="card"><h2>Sign</h2><div class="fld'+(e.signedName?' err':'')+'"><label for="signedName">Type your full name</label><input type="text" id="signedName" autocomplete="name" autocapitalize="words" value="'+esc(S.signedName)+'">'+(e.signedName?'<div class="emsg">'+esc(e.signedName)+'</div>':'')+'</div>'+
    '<div class="fld'+(e.signature?' err':'')+'"><div class="lbl">Sign with your finger or mouse</div><div class="sigwrap"><canvas id="sig"></canvas><div class="line"></div><div class="ph" id="sigPh">Sign here</div></div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><span class="hint">Signed '+esc(new Date().toLocaleDateString('en-NZ',{day:'numeric',month:'long',year:'numeric'}))+'</span><button class="btn" type="button" id="sigClear" style="min-height:40px">Clear</button></div>'+
    (e.signature?'<div class="emsg">'+esc(e.signature)+'</div>':'')+'</div></div>';
}
function answerText(f){
  if(f.t==='upload'){ var l=S.uploads[f.k]||[]; return l.length? l.map(function(x){ return x.name; }).join(', ') : ''; }
  var v=String(S.answers[f.k]||''); if(f.t==='date') return nzDate(v); if(f.t==='money'&&v) return money(v.replace(/[$,\s]/g,'')); return v;
}
function reviewHtml(){
  var h='<div class="card"><h2>Check your answers</h2><p class="intro">Tap Edit to change anything, then submit.</p></div>';
  S.steps.forEach(function(st,i){
    if(!st.fields) return;
    var errs=check(st), rows='';
    st.fields.forEach(function(f){ if(!visible(f)) return; var t=answerText(f); if(!t && !errs[f.k]) return;
      rows+='<dt>'+esc(f.l)+'</dt><dd'+(errs[f.k]?' class="missing"':'')+'>'+esc(t||errs[f.k])+'</dd>'; });
    h+='<div class="card rev"><h3>'+esc(st.title)+'<button type="button" data-edit="'+i+'">Edit</button></h3>'+(rows?'<dl>'+rows+'</dl>':'<div class="hint">Nothing entered</div>')+'</div>';
  });
  h+='<div class="card rev"><h3>Agree and sign<button type="button" data-edit="'+(S.steps.length-2)+'">Edit</button></h3><div class="hint">'+(S.sigDrawn?'✓ Signed by '+esc(S.signedName):'<span class="missing">Not signed yet</span>')+'</div></div>';
  if(S.submitError) h='<div class="banner">'+esc(S.submitError)+'</div>'+h;
  return h;
}

/* ---------- Signature pad ---------- */
var sigCanvas=null, sigCtx=null, sigPts=null;
function initSig(){
  sigCanvas=$('#sig'); var r=sigCanvas.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
  sigCanvas.width=Math.round(r.width*dpr); sigCanvas.height=Math.round(r.height*dpr);
  sigCtx=sigCanvas.getContext('2d'); sigCtx.scale(dpr,dpr); sigCtx.lineWidth=2.4; sigCtx.lineCap='round'; sigCtx.lineJoin='round'; sigCtx.strokeStyle='#0f172a';
  if(S.sigImage){ var im=new Image(); im.onload=function(){ sigCtx.drawImage(im,0,0,r.width,r.height); }; im.src=S.sigImage; $('#sigPh').classList.add('hidden'); }
  function pos(e){ var b=sigCanvas.getBoundingClientRect(); return {x:e.clientX-b.left,y:e.clientY-b.top}; }
  sigCanvas.addEventListener('pointerdown',function(e){ e.preventDefault(); sigCanvas.setPointerCapture(e.pointerId); sigPts=pos(e); sigCtx.beginPath(); sigCtx.moveTo(sigPts.x,sigPts.y); $('#sigPh').classList.add('hidden'); });
  sigCanvas.addEventListener('pointermove',function(e){ if(!sigPts) return; e.preventDefault(); var p=pos(e); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); sigPts=p; S.sigDrawn=true; });
  function end(){ if(!sigPts) return; sigPts=null; if(S.sigDrawn){ S.sigImage=sigCanvas.toDataURL('image/png'); if(S.errors.signature){ delete S.errors.signature; } } }
  sigCanvas.addEventListener('pointerup',end); sigCanvas.addEventListener('pointercancel',end); sigCanvas.addEventListener('pointerleave',end);
  $('#sigClear').addEventListener('click',function(){ sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height); S.sigDrawn=false; S.sigImage=''; $('#sigPh').classList.remove('hidden'); });
}
/* ---------- Saving ---------- */
var saveTimer=null;
function keepLocal(){ try{ localStorage.setItem(LS,JSON.stringify({answers:S.answers,consents:S.consents,signedName:S.signedName})); }catch(e){} }
function changed(){ keepLocal(); S.dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,1500); }
function saveNow(){
  if(!S.dirty||S.saving) return Promise.resolve();
  S.saving=true; S.dirty=false; $('#saved').textContent='Saving…';
  return api('save',{answers:S.answers}).then(function(r){ S.saving=false; $('#saved').textContent=r.ok?'✓ Saved':(r.error||'Not saved'); },
    function(){ S.saving=false; S.dirty=true; $('#saved').textContent='Offline — your answers are kept on this device and will save when you’re back online'; });
}
window.addEventListener('online',function(){ if(S.dirty) saveNow(); });
document.addEventListener('visibilitychange',function(){ if(document.hidden) saveNow(); });

/* ---------- Uploads ---------- */
function shrink(file){
  return new Promise(function(res){
    if(!/^image\//.test(file.type) || /gif/.test(file.type)){ res(file); return; }
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var s=Math.min(1,MAX_EDGE/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){ res(b? new File([b],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}) : file); },'image/jpeg',0.82);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); res(file); };
    img.src=url;
  });
}
function toB64(blob){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){ res(String(r.result).split(',')[1]); }; r.onerror=rej; r.readAsDataURL(blob); }); }
function uploadFiles(key,files){
  var prog=document.querySelector('[data-prog="'+key+'"]'), i=0, msgs=[];
  function next(){
    if(i>=files.length){ render(); if(msgs.length) setTimeout(function(){ var p=document.querySelector('[data-prog="'+key+'"]'); if(p){ p.textContent=msgs.join(' '); p.style.color='var(--bad)'; } },0); return; }
    var f=files[i++]; if(prog) prog.textContent='Uploading '+f.name+'…';
    shrink(f).then(function(b){
      if(b.size>MAX_BYTES){ msgs.push(f.name+' is too large (over 8 MB).'); return next(); }
      var type=b.type||(/\.pdf$/i.test(f.name)?'application/pdf':'image/jpeg');
      return toB64(b).then(function(d){ return api('upload',{item:key,name:f.name,mime:type,data:d}); }).then(function(r){
        if(r.ok){ S.uploads=r.uploads; delete S.errors[key]; } else msgs.push(r.error); next();
      });
    }).catch(function(e){ msgs.push(e.message||'Upload failed.'); next(); });
  }
  next();
}

/* ---------- Events ---------- */
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.k){ S.answers[t.dataset.k]=t.value; if(S.errors[t.dataset.k]){ delete S.errors[t.dataset.k]; var f=t.closest('.fld'); if(f){ f.classList.remove('err'); var m=f.querySelector('.emsg'); if(m) m.remove(); } } changed(); }
  if(t.id==='signedName'){ S.signedName=t.value; keepLocal(); }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.up){ var files=[].slice.call(t.files||[]); t.value=''; if(files.length) uploadFiles(t.dataset.up,files); }
  if(t.dataset&&t.dataset.consent){ S.consents[t.dataset.consent]=t.checked; t.closest('.check').classList.toggle('on',t.checked); t.closest('.check').classList.remove('err'); keepLocal(); }
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||e.isComposing) return;
  var t=e.target; if(t.tagName!=='INPUT'||t.type==='checkbox'||t.type==='file') return;
  var nx=document.querySelector('[data-go=next]'); if(nx){ e.preventDefault(); nx.click(); }
});
document.addEventListener('click',function(e){
  var o=e.target.closest('[data-opt]');
  if(o){ var k=o.dataset.k, was=S.answers[k]; S.answers[k]=o.dataset.opt; delete S.errors[k]; changed();
    var st=S.steps[S.step], affects=(st.fields||[]).some(function(f){ return f.if&&f.if[0]===k; });
    if(affects&&was!==o.dataset.opt){ var y=window.scrollY; $('#main').innerHTML=stepCard(st); window.scrollTo(0,y); }
    else [].forEach.call(o.parentNode.children,function(b){ b.classList.toggle('on',b===o); b.setAttribute('aria-checked',b===o); var f=o.closest('.fld'); f.classList.remove('err'); var m=f.querySelector('.emsg'); if(m) m.remove(); });
    return; }
  var rm=e.target.closest('[data-rm]');
  if(rm){ rm.disabled=true; api('removeUpload',{item:rm.dataset.k,id:rm.dataset.rm}).then(function(r){ if(r.ok) S.uploads=r.uploads; render(); }).catch(function(err){ rm.disabled=false; alert(err.message); }); return; }
  var ed=e.target.closest('[data-edit]'); if(ed){ S.step=+ed.dataset.edit; S.errors={}; render(); return; }
  var go=e.target.closest('[data-go]'); if(!go) return;
  var a=go.dataset.go, st=S.steps[S.step];
  if(a==='back'){ S.errors={}; S.step=Math.max(0,S.step-1); render(); saveNow(); return; }
  if(a==='next'){
    var errs=check(st); S.errors=errs;
    if(Object.keys(errs).length){ render(); var first=document.querySelector('.err'); if(first) first.scrollIntoView({behavior:'smooth',block:'center'}); return; }
    S.step=Math.min(S.steps.length-1,S.step+1); render(); saveNow(); return;
  }
  if(a==='submit') submit(go);
});

function submit(btn){
  // find the first step with a problem
  for(var i=0;i<S.steps.length;i++){ var errs=S.steps[i].fields||S.steps[i].id==='sign'? check(S.steps[i]) : {}; if(Object.keys(errs).length){ S.errors=errs; S.step=i; render(); var f=document.querySelector('.err'); if(f) f.scrollIntoView({block:'center'}); return; } }
  btn.disabled=true; btn.innerHTML='<span class="spin" style="width:20px;height:20px;border-color:rgba(255,255,255,.4);border-top-color:#fff"></span> Submitting…';
  flattenSig(S.sigImage).then(function(sig){
    return api('submit',{answers:S.answers,consents:S.consents,signedName:S.signedName,signature:sig,userAgent:navigator.userAgent,tz:(Intl.DateTimeFormat().resolvedOptions().timeZone||'')});
  }).then(function(r){
    if(r.ok){ try{ localStorage.removeItem(LS); sessionStorage.removeItem(LS+'-step'); }catch(e){} done(r,false); return; }
    if(r.problems&&r.problems.length){
      var keys={}; r.problems.forEach(function(p){ keys[p.k]=p.m; });
      for(var i=0;i<S.steps.length;i++){ var st=S.steps[i]; var hit=(st.fields||[]).some(function(f){ return keys[f.k]; }) || (st.id==='sign'&&(keys.signature||keys.signedName||S.data.consents.some(function(c){ return keys[c.k]; })));
        if(hit){ S.errors=keys; S.step=i; render(); return; } }
    }
    S.submitError=r.error||'Your application could not be submitted.'; render();
  }).catch(function(e){ S.submitError=e.message; render(); });
}
/* Signature with a white background, max 900px wide, for the PDF */
function flattenSig(dataUrl){
  return new Promise(function(res){
    if(!dataUrl){ res(''); return; }
    var im=new Image(); im.onload=function(){ var w=Math.min(im.width,900), h=Math.round(im.height*w/im.width), c=document.createElement('canvas'); c.width=w; c.height=h;
      var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(im,0,0,w,h); res(c.toDataURL('image/png')); };
    im.onerror=function(){ res(dataUrl); }; im.src=dataUrl;
  });
}
function done(r,already){
  $('#side').classList.add('hidden');
  try{ localStorage.removeItem(LS+'-max'); }catch(e){}
  $('#hProg').classList.add('hidden'); $('#foot').classList.add('hidden');
  $('#hTitle').textContent=(r.property&&r.property.address1)||(S.data&&S.data.property.address1)||'Rental application';
  $('#hSub').textContent='Application '+(already?'already ':'')+'submitted';
  $('#main').innerHTML='<div class="card center"><div class="big">✅</div><h2 style="margin-top:10px">Thank you'+(S.answers.ApplicantName?', '+esc(String(S.answers.ApplicantName).split(' ')[0]):'')+'!</h2>'+
    '<p class="intro">Your application '+(already?'has already been':'has been')+' received'+(r.submittedAt?' on '+esc(new Date(r.submittedAt).toLocaleString('en-NZ',{day:'numeric',month:'long',hour:'numeric',minute:'2-digit'})):'')+'. A copy has been emailed to you.</p>'+
    '<p class="intro" style="margin:0">We’ll be in touch once we’ve considered all the applications.</p></div>';
}
})();
